<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetTimeOut</title>
</head>
<body>
    <input type="button" onclick="clickme()" value="Open">

    <script type="text/javascript">
        function clickme()
        {
            setTimeout(function()
            {
                alert("I am Pravin");
            },1000)
        }
    </script>
</body>
</html>
