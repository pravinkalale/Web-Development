<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        <!--default function-->

        function apsara()   //function def
        {
            document.write("Hello","<br>"); //func body
        }
        apsara(); //func call
        document.write("good morning","<br>");
        apsara();

        <!--parametrized function -->

        function addition(a, b)  // parameter
        {
            let sum = a + b;
                document.write("addition =" + sum);
        }
        addition(10, 20);  //arguments

    </script>
    
</body>
</html>
