<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladder statement</title>
</head>
<body>
    <script>
        let marks = 68;

        if(marks >= 75)
        {
            document.write("Distinction");
        }
        else if(marks >= 60)
        {
            document.write("First Class");
        }
        else if(marks >= 50)
        {
            document.write("Second Class");
        }
        else
        {
            document.write("Fail");
        }
    </script>
</body>
</html>
