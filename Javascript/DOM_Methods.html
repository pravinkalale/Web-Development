<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    
    <h2>GetElementById</h2>
    <input type="text" id="number"/>
    <input type="button" value="submit" onclick="show()"/>
    
    <h1 id="heading">Hello World</h1>

    <button type="button" onclick="changeText()">Change</button>

    <script type="text/javascript">
        function changeText()
        {
            document.getElementById("heading").innerHTML = "Welcome Pravin";
        }

        function show()
        {
            var num = document.getElementById("number").value;
            alert(num);
        }

        document.write("<h2> GetElementsByName</h2>")

        function pk()
        {
            var x=document.getElementsByName("abc");
            alert("Total elements are:"+x.length);
        }
    </script>

    
    <h4 name="abc">I</h4>
    <h4 name="abc">Am</h4>
    <h4 name="abc">Javascript</h4>

    <input type="button" value="submit" onclick="pk()">

</body>
</html>
