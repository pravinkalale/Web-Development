<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.write("<h2> SQUARE </H2>")

        for(let i=1; i <= 10; i++)
        {
            document.write(  i*i + "<br>")
        }

        document.write("<h2> CUBE </h2>")

        for(let a=1; a <= 10; a++)
        {
            document.write(  a*a*a + "<br>")
        }

        document.write("<h2> TABLE </h2>")

        for (let p=1; p<=10; p++)
        {
            document.write(p*2 +"<br>");
        }
    </script>
</body>
</html>
