    <input type="button" onclick="clickme()" value="Confirm Alert">

    <script type="text/javascript">

        function clickme(){
            var v= confirm("Do you want to delete ?");
            if(v==true)
            {
                alert("ok");
            }    
            else
            {
                alert("cancel");
            }
            }
        
    </script>

            var name= prompt("What is your name?");
                alert("My Name is"+name);
        }
