<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Looping statement</title>
</head>
<body>
    <script>
        <!--For loop-->

        for(let i = 1; i <= 5; i++)
        {
            document.write("Hello<br>");
        }
    </script>
</body>
</html>
