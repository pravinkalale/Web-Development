<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <!--for loop-->

    <script>
        for(let i=1; i<=10; i++)
        {
            document.write(i + "<br>")
        }

        document.write("<h2> Even Numbers </h2> ");

        for(let a=1; a<=20; a++)
        {
            if(a%2===0)
            {
                document.write( a + "<br>")
            }
        }

        document.write("<h2> Odd Numbers </h2> ");

        for(let p=1; p<=20; p++)
        {
            if(p%2!==0)
            {
                document.write(p + "<br>");
            }
        }

        document.write("<h2> SQUARE </h2>");

        for(let i=1; i<=10; i++ )
        {
            document.write("square of " + i + "=" + (i*i) +"<br>")
        }

        document.write("<h2> CUBE </h2>");

        for(let k=1; k<=10; k++ )
        {
            document.write("cube of " + k + "=" + (k*k*k) + "<br>");
        }
    </script>

    <!--while loop -->

    <script>

        document.write("<h2> While loop </h2> ")

        let i = 1;

        while(i<=10)
        {
            document.write(i + "<br>");
            i++;
        }

        document.write("<h2> Even Numbers </h2> ")

        let p = 1;

        while(p<=20)
        {
            if(p % 2 === 0)
            {
                document.write( p + "<br>");
            
            }
            p++;
        }

        document.write("<h2> ODD Numbers </h2> ")

        let m = 1;

        while(m<=20)
        {
            if(m % 2 !== 0)
            {
                document.write( m + "<br>");
            }
            m++;
        }

        document.write("<h2> Break statement </h2> ")

        let b = 1;

        while(b<=20)
        {
            if(b == 7)
            { 
                break;
            }
            document.write(b +"<br>");
            b++;
        }

        document.write("<h2> continue statement </h2> ")

        let c = 1;

        while(c<=10)
        {
            if(c == 5)
            { 
                c++;
                 continue; 
                
            }
            document.write(c +"<br>"); 
            c++;
            
        }

        document.write("<h2> print reverse numbers </h2> ");

        let d=10;
        
        while(d>=1)
        {
            document.write(d + "<br>");
            d--;
        }

    </script>
</body>
</html>
