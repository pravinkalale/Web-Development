<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<body>
    <script>
        for(let i=1; i<=10; i++)
        {
            document.write(i + "<br>")
        }

        document.write("<h2> Even Numbers </h2> ");

        for(let a=1; a<=20; a++)
        {
            if(a%2===0)
            {
                document.write( a + "<br>")
            }
        }

        document.write("<h2> Odd Numbers </h2> ");

        for(let p=1; p<=20; p++)
        {
            if(p%2!==0)
            {
                document.write(p + "<br>");
            }
        }
    </script>
</body>
</html>
